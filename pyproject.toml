[project]
name = "ipl-smart-bets-bot"
version = "0.1.0"
description = "Telegram bot and FastAPI backend for IPL value betting decisions."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "apscheduler>=3.10.4",
    "fastapi>=0.115.0",
    "joblib>=1.4.2",
    "numpy>=2.1.2",
    "pydantic-settings>=2.5.2",
    "psycopg[binary]>=3.2.3",
    "python-telegram-bot>=21.6",
    "requests>=2.32.3",
    "scikit-learn>=1.5.2",
    "sqlalchemy>=2.0.36",
    "uvicorn[standard]>=0.32.0",
    "xgboost>=3.0.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
